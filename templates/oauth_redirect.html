<!DOCTYPE html>
<html>
<head><title>Signing in...</title></head>
<body>
<script>
    const params = new URLSearchParams(window.location.hash.substring(1));
    const accessToken = params.get('access_token');

    if (accessToken) {
        // Send only the token; the server verifies it with Google itself.
        history.replaceState(null, '', window.location.pathname);
        fetch('/auth/google/callback', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ access_token: accessToken })
        })
        .then(r => r.json())
        .then(data => {
            if (data.success) window.location.href = '/';
            else window.location.href = '/?error=auth_failed';
        })
        .catch(() => window.location.href = '/?error=auth_failed');
    } else {
        window.location.href = '/?error=no_token';
    }
</script>
<p style="font-family: 'DM Mono', monospace; font-size: 13px; color: #4A453D; background: #ECE7DD; margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;">Signing you in&hellip;</p>
</body>
</html>
